# Deploy the plain HTML, CSS, and JavaScript site to Azure App Service.

name: Deploy static site to Azure Web App - adman-crew-cost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Verify calculator totals
        run: npm test

      - name: Stage static site
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          rsync -av             --exclude='.git/'             --exclude='.github/'             --exclude='README.md'             ./ "${RUNNER_TEMP}/site/"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2DC76820A0184E2291C4DFF08B457DE6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C27068912B2E4CEBB2A1E0FBAA42D7A3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_24A9E5134B92400DB14C8C9F95997119 }}

      - name: Deploy static site
        uses: azure/webapps-deploy@v3
        with:
          app-name: adman-crew-cost
          slot-name: Production
          package: ${{ runner.temp }}/site
